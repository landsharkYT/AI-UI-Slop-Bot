name: AI UI Slop Bot
description: Run the pinned native scanner and upload its canonical report and Refactoring Brief.

inputs:
  binary-path:
    description: Absolute path to a preinstalled, integrity-verified ai-ui-slop binary.
    required: true
  artifact-name:
    description: Workflow artifact name.
    required: false
    default: ai-ui-slop-report
  trusted-policy-path:
    description: Protected target-branch worktree containing policy and Reviewed Baseline.
    required: false
    default: ""
  wall-time-seconds:
    description: Cooperative scanner wall-time ceiling.
    required: false
    default: "600"
  outer-memory-mib:
    description: Linux process virtual-memory ceiling.
    required: false
    default: "1536"

outputs:
  exit-code:
    description: Stable scanner exit code.
    value: ${{ steps.scan.outputs.exit-code }}
  report-path:
    description: Canonical report path.
    value: ${{ github.workspace }}/.ai-ui-slop/reports/report.json
  brief-path:
    description: Refactoring Brief path.
    value: ${{ github.workspace }}/.ai-ui-slop/reports/refactoring-brief.md

runs:
  using: composite
  steps:
    - id: scan
      name: Run whole-repository scan
      shell: bash
      env:
        AI_UI_SLOP_BINARY: ${{ inputs.binary-path }}
        AI_UI_SLOP_TRUSTED_POLICY: ${{ inputs.trusted-policy-path }}
        AI_UI_SLOP_WALL_TIME: ${{ inputs.wall-time-seconds }}
        AI_UI_SLOP_OUTER_MEMORY_MIB: ${{ inputs.outer-memory-mib }}
      run: |
        set -euo pipefail
        scan_args=(scan "$GITHUB_WORKSPACE" --format terminal --progress auto --max-wall-time-seconds "$AI_UI_SLOP_WALL_TIME")
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          ulimit -v "$((AI_UI_SLOP_OUTER_MEMORY_MIB * 1024))"
        fi
        if [[ -n "$AI_UI_SLOP_TRUSTED_POLICY" ]]; then
          scan_args+=(--trusted-policy-root "$AI_UI_SLOP_TRUSTED_POLICY")
        fi
        set +e
        "$AI_UI_SLOP_BINARY" "${scan_args[@]}"
        scan_status="$?"
        set -e
        case "$scan_status" in
          0|1|2|3|4|130) ;;
          *) scan_status=4 ;;
        esac
        echo "exit-code=$scan_status" >> "$GITHUB_OUTPUT"

    - id: upload
      name: Upload canonical reports
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: ${{ always() && hashFiles('.ai-ui-slop/reports/report.json') != '' }}
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          .ai-ui-slop/reports/report.json
          .ai-ui-slop/reports/refactoring-brief.md
        if-no-files-found: error

    - name: Write job summary
      if: ${{ always() && hashFiles('.ai-ui-slop/reports/refactoring-brief.md') != '' }}
      shell: bash
      run: |
        {
          echo "## AI UI Slop Bot"
          echo
          echo "Scanner exit code: \`${{ steps.scan.outputs.exit-code }}\`"
          echo
          echo "[Download canonical report artifacts](${{ steps.upload.outputs.artifact-url }})"
          echo
          cat "$GITHUB_WORKSPACE/.ai-ui-slop/reports/refactoring-brief.md"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Preserve scanner outcome
      if: ${{ always() }}
      shell: bash
      env:
        AI_UI_SLOP_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
      run: |
        case "$AI_UI_SLOP_EXIT_CODE" in
          0) exit 0 ;;
          1|2|3|4|130) exit "$AI_UI_SLOP_EXIT_CODE" ;;
          *) exit 4 ;;
        esac
