[package]
name = "ai-ui-slop"
version = "0.14.0"
edition = "2024"
description = "Evidence-first detector for repeated AI-style UI decoration"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "ai_ui_slop"
path = "src/lib.rs"

[[bin]]
name = "ai-ui-slop"
path = "src/main.rs"

[dependencies]
oxc_allocator = "0.142.0"
oxc_ast = "0.142.0"
oxc_ast_visit = "0.142.0"
oxc_parser = "0.142.0"
oxc_span = "0.142.0"
oxc_syntax = "0.142.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ctrlc = "3.5.2"

[dev-dependencies]
tempfile = "3.20"

# Oxc makes debug test binaries large, and this repository has many integration
# test targets. Keep source line information for diagnostics without retaining
# full debug symbols or per-crate incremental caches after every agent pass.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
