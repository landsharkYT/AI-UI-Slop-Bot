name: Release native binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: ai-ui-slop-linux-x86_64.tar.gz
            executable: ai-ui-slop
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: ai-ui-slop-linux-aarch64.tar.gz
            executable: ai-ui-slop
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: ai-ui-slop-macos-x86_64.tar.gz
            executable: ai-ui-slop
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: ai-ui-slop-macos-aarch64.tar.gz
            executable: ai-ui-slop
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: ai-ui-slop-windows-x86_64.zip
            executable: ai-ui-slop.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Verify
        run: cargo test --locked --all-targets --all-features

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" dist/package/
          cp LICENSE-APACHE LICENSE-MIT README.md docs/support-matrix.md dist/package/
          tar -C dist/package -czf "dist/${{ matrix.archive }}" .
          sha256sum "dist/${{ matrix.archive }}" > "dist/${{ matrix.archive }}.sha256"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" dist/package/
          Copy-Item LICENSE-APACHE, LICENSE-MIT, README.md, docs/support-matrix.md dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/${{ matrix.archive }}"
          $hash = (Get-FileHash "dist/${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Set-Content -NoNewline "dist/${{ matrix.archive }}.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Build authenticated digest manifest and source SBOM
        shell: bash
        run: |
          find release -maxdepth 1 -type f ! -name '*.sha256' -print0 |
            sort -z |
            xargs -0 sha256sum > release/SHA256SUMS
          scripts/generate-sbom.sh release/ai-ui-slop.spdx.json

      - uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
            release/ai-ui-slop.spdx.json

      - name: Publish immutable tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --clobber=false
